<body class="preview-document">
  <main class="preview-copy">
    <a class="preview-back" href="./">← 回到放映桌</a>
    <h1>使用说明</h1>
    <ol class="preview-steps">
      <li><h2>装片</h2><p>点「选 14 张照片」从设备选图，或者点「试放样片」。装好后可以点圆盘上的任意一格单独换照片。</p><img src="load.jpg" alt="照片装入圆盘后，圆盘位于红色放映机上方" width="640" height="480"></li>
      <li><h2>放映</h2><p>点「推盘放映 ↓」，等胶片盘滑入、放映灯亮起，照片就会开始播放。</p><img src="screen.jpg" alt="放映时，两张照片出现在放映机上方的两扇取景窗里" width="640" height="480" loading="lazy"></li>
      <li><h2>取片</h2><p>放完后点「取走影片」，将生成的视频保存到设备。</p><img src="save.jpg" alt="放映结束，红色放映机上出现可以取走影片的纸质片袋" width="640" height="480" loading="lazy"></li>
    </ol>
    <h2>可以放些什么</h2>
    <ul><li>把一趟旅行的沿途风景和合照剪在一起。</li><li>挑出宠物从小时候到现在的照片，做成一卷成长记录。</li><li>收齐一次朋友聚会的照片，做成可以转发的小影片。</li></ul>
  </main>
